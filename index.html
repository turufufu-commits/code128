<style>
:root{--bg:#f2f4f8;--surface:#fff;--text:#1a1f2b;--muted:#5f6675;--line:#d5dae3;--navy:#1f3864;--blue:#2f5597;--field:#fff2cc;--err:#c00000;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f131b;--surface:#1a2030;--text:#e8ebf2;--muted:#9aa3b5;--line:#2c3447;--field:#4a3f12;--err:#ff8a8a}}
:root[data-theme="dark"]{--bg:#0f131b;--surface:#1a2030;--text:#e8ebf2;--muted:#9aa3b5;--line:#2c3447;--field:#4a3f12;--err:#ff8a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"SF Pro Text","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px}
header h1{margin:0;font-size:18px;font-weight:700}
header p{margin:2px 0 0;font-size:13px;color:#c9d6f0}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.card label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.2px}
.card input{width:100%;font:700 22px Menlo,Consolas,monospace;padding:11px 12px;border:1.5px solid #7f7f7f;border-radius:10px;background:var(--field);color:var(--text);text-transform:uppercase}
.msg{min-height:20px;margin:6px 2px 8px;font-size:13px;font-weight:700;color:var(--err)}
.bc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 6px 6px;text-align:center}
.bc svg{display:block;width:100%;height:110px}
.bc div{font:700 20px Menlo,Consolas,monospace;color:#000;padding-top:6px;min-height:30px;word-break:break-all}
.go{margin-top:12px;width:100%;border:0;border-radius:12px;padding:14px;font:700 17px inherit;background:var(--blue);color:#fff}
.go:disabled{opacity:.4}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:4px 4px 0}
nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;min-width:0;white-space:nowrap;background:none;border:0;padding:6px 0;font:600 10px inherit;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--blue)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{color:#8fb3ff}}
#full{position:fixed;inset:0;background:#fff;z-index:10;display:none}
#full.show{display:block}
#stage{position:absolute;display:flex;flex-direction:column;padding:24px 14px 18px;background:#fff;color:#000}
#stage svg{flex:1;min-height:0;width:100%}
#stage .t{text-align:center;font:700 26px Menlo,Consolas,monospace;padding-top:10px;word-break:break-all}
#stage .h{text-align:center;font-size:12px;color:#666;padding-top:6px}
#rot{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:11;display:none;border:1px solid #bbb;background:#f4f4f4;color:#222;border-radius:18px;padding:7px 14px;font:600 14px inherit}
#full.show~#rot{display:block}

#scan{position:fixed;inset:0;background:#000;z-index:20;display:none}
#scan.show{display:block}
#shint{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);margin:0;text-align:center;color:#fff;font:600 15px inherit;line-height:1.3}
#pic{position:absolute;display:none;touch-action:none;background:#111}
#sbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:12px;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);background:#000}
#sbar button{flex:1;border:0;border-radius:12px;padding:14px;font:700 16px inherit}
#scx{background:#fff;color:#111}
#scok{background:#2f5597;color:#fff}
#scok:disabled{opacity:.4}
.cam{margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--blue);border-radius:12px;padding:11px;background:transparent;color:var(--blue);font:700 15px inherit}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cam{color:#8fb3ff;border-color:#8fb3ff}}
</style>
</head>
<body>
<header><h1>Générateur de codes-barres Code 128</h1><p id="sub"></p></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="full"><div id="stage"></div></div>
<button id="rot" type="button">Pivoter</button>
<div id="scan"><p id="shint"></p><canvas id="pic"></canvas><div id="sbar"><button id="scx" type="button">Annuler</button><button id="scok" type="button" disabled>Lire la zone</button></div></div>
<input type="file" id="pho" accept="image/*" capture="environment" style="display:none">
<svg width="0" height="0" style="position:absolute"><symbol id="ic" viewBox="0 0 24 24"><path fill="currentColor" d="M3 5h2v14H3zM7 5h1v14H7zM10 5h3v14h-3zM15 5h1v14h-1zM18 5h2v14h-2zM21 5h1v14h-1z"/></symbol></svg>
<script>
var PAT="212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,114131,311141,411131,211412,211214,211232,2331112".split(",");
var MAX=20;
var TABS=[
 {id:"f",label:"Identifiant",title:"Identifiant",cards:[["Premier code","R080475"],["Second code","0475"]]},
 {id:"1",label:"Contenant 1",title:"Contenant 1",cards:[["Code à générer","MKCS"]]},
 {id:"2",label:"Contenant 2",title:"Contenant 2",cards:[["Code à générer","MKCS"]]},
 {id:"3",label:"Vemb 1",title:"Vemb 1",cards:[["Code à générer","MKVE"]]},
 {id:"4",label:"Vemb 2",title:"Vemb 2",cards:[["Code à générer","MKVE"]]},
 {id:"e",label:"Essai",title:"Essai",cam:true,cards:[["Code à générer","MKCS"]]}
];
var CAM='<button class="cam" type="button"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>Scanner avec l’appareil photo</button>';
function convert(txt){
 var raw=String(txt),t=raw.toUpperCase().replace(/[^A-Z0-9]+/g," ").trim(),m=t.match(/\b(\d{2})\s+([A-Z][A-Z0-9]?)\s*(\d{2})\b/);
 if(!m)return {err:"Zone non reconnue (attendu : 24 F2 13). Texte lu : « "+raw.replace(/\s+/g," ").trim().slice(0,40)+" »"};
 return {val:"MKCS"+m[1]+"X"+m[3],read:m[1]+" "+m[2]+" "+m[3]};
}
function loadTS(ok,ko){
 if(window.Tesseract){ok();return}
 var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
 s.onload=ok;s.onerror=ko;document.head.appendChild(s);
}
function scan(done){
 function g(i){return document.getElementById(i)}
 var box=g("scan"),hint=g("shint"),cv=g("pic"),ok=g("scok"),f=g("pho"),over=false,worker=null,img=null,sel=null,st=null,s=1;
 function stop(){over=true;try{if(worker)worker.terminate()}catch(e){}box.className="";cv.style.display="none"}
 function paint(){
  var x=cv.getContext("2d"),W=cv.width,H=cv.height;
  x.drawImage(img,0,0,W,H);
  if(sel){x.fillStyle="rgba(0,0,0,.5)";x.fillRect(0,0,W,sel.y);x.fillRect(0,sel.y+sel.h,W,H-sel.y-sel.h);x.fillRect(0,sel.y,sel.x,sel.h);x.fillRect(sel.x+sel.w,sel.y,W-sel.x-sel.w,sel.h);x.strokeStyle="#ffd400";x.lineWidth=3;x.strokeRect(sel.x,sel.y,sel.w,sel.h)}
 }
 function layout(){
  var W=window.innerWidth,H=window.innerHeight-60-100;
  s=Math.min(W/img.width,H/img.height);cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
  cv.style.width=cv.width+"px";cv.style.height=cv.height+"px";cv.style.left=Math.round((W-cv.width)/2)+"px";cv.style.top="60px";paint();
 }
 function crop(){
  var k=1/s,sx=Math.max(0,Math.round(sel.x*k)),sy=Math.max(0,Math.round(sel.y*k)),sw=Math.min(img.width-sx,Math.round(sel.w*k)),sh=Math.min(img.height-sy,Math.round(sel.h*k));
  var u=sw<700?2:(sw>2000?2000/sw:1),c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(sw*u));c.height=Math.max(1,Math.round(sh*u));
  var x=c.getContext("2d");x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  var d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(var i=0;i<p.length;i+=4){var v=p[i]*0.3+p[i+1]*0.59+p[i+2]*0.11;v=(v-128)*1.4+128;v=v<0?0:v>255?255:v;p[i]=p[i+1]=p[i+2]=v}
  x.putImageData(d,0,0);return c;
 }
 cv.onpointerdown=function(e){var r=cv.getBoundingClientRect();st={x:e.clientX-r.left,y:e.clientY-r.top};sel=null;ok.disabled=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()};
 cv.onpointermove=function(e){
  if(!st)return;var r=cv.getBoundingClientRect(),x=Math.max(0,Math.min(cv.width,e.clientX-r.left)),y=Math.max(0,Math.min(cv.height,e.clientY-r.top));
  sel={x:Math.min(st.x,x),y:Math.min(st.y,y),w:Math.abs(x-st.x),h:Math.abs(y-st.y)};paint();
 };
 cv.onpointerup=cv.onpointercancel=function(){st=null;ok.disabled=!(sel&&sel.w>24&&sel.h>14)};
 g("scx").onclick=stop;
 ok.onclick=function(){
  if(!sel)return;ok.disabled=true;hint.textContent="Chargement du lecteur de texte…";
  loadTS(function(){
   var c=crop();
   Tesseract.createWorker("eng",1,{logger:function(m){if(!over&&m.status==="recognizing text")hint.textContent="Lecture du texte… "+Math.round(m.progress*100)+" %"}}).then(function(w){
    worker=w;if(over){w.terminate();return}
    return w.setParameters({tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789- ",tessedit_pageseg_mode:"6"}).then(function(){return w.recognize(c)}).then(function(r){if(over)return;var t=r.data.text;stop();if(navigator.vibrate)navigator.vibrate(60);done(t)});
   }).catch(function(){if(!over){hint.textContent="Lecture impossible : connexion internet nécessaire (premier scan) ou navigateur non compatible.";ok.disabled=false}});
  },function(){hint.textContent="Lecteur de texte non chargé : connexion internet requise.";ok.disabled=false});
 };
 f.value="";
 f.onchange=function(){
  var file=f.files&&f.files[0];if(!file)return;
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
   img=im;sel=null;st=null;over=false;ok.disabled=true;box.className="show";cv.style.display="block";
   hint.textContent="Entourez avec le doigt les caractères à lire, puis touchez « Lire la zone ».";layout();
  };
  im.onerror=function(){};im.src=url;
 };
 f.click();
}
var data={},cur=0;
try{data=JSON.parse(localStorage.getItem("c128v1")||"{}")||{}}catch(e){data={}}
function save(){try{localStorage.setItem("c128v1",JSON.stringify(data))}catch(e){}}
function val(t,i){var k=t.id+"_"+i;return (k in data)?data[k]:t.cards[i][1]}

function check(s){
 if(!s)return "Saisir un code";
 if(s.length>MAX)return MAX+" caractères maximum";
 for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c<32||c>126)return "Caractère non pris en charge (pas d’accent)"}
 return "";
}
function encode(s){
 var v=[104],sum=104,i;
 for(i=0;i<s.length;i++){var x=s.charCodeAt(i)-32;v.push(x);sum+=x*(i+1)}
 v.push(sum%103);v.push(106);
 var w=[10],bar=false;
 v.forEach(function(n){PAT[n].split("").forEach(function(d){w.push(+d)})});
 w.push(10);return w;
}
function svg(s){
 var w=encode(s),x=0,r="",bar=true;
 for(var i=0;i<w.length;i++){
  if(i>0&&i<w.length-1){ if(bar)r+='<rect x="'+x+'" y="0" width="'+w[i]+'" height="10"/>'; bar=!bar }
  x+=w[i];
 }
 return '<svg viewBox="0 0 '+x+' 10" preserveAspectRatio="none" shape-rendering="crispEdges">'+r+'</svg>';
}
function draw(card,s){
 var err=check(s);
 var mg=card.querySelector(".msg");mg.style.color="";mg.textContent=err;
 var bc=card.querySelector(".bc");
 bc.innerHTML=err?'<div style="color:#888;font-weight:400;font-size:14px;padding:44px 0">Aperçu</div>':svg(s)+'<div>'+esc(s)+'</div>';
 card.querySelector(".go").disabled=!!err;
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function render(){
 var t=TABS[cur];
 document.getElementById("sub").textContent=t.title;
 var m=document.getElementById("main");m.innerHTML="";m.scrollTop=0;
 t.cards.forEach(function(c,i){
  var d=document.createElement("div");d.className="card";
  d.innerHTML='<label>'+c[0]+'</label><input type="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="40">'+(t.cam?CAM:'')+'<div class="msg"></div><div class="bc"></div><button class="go" type="button">Plein écran</button>';
  var inp=d.querySelector("input");inp.value=val(t,i);
  inp.addEventListener("input",function(){
   var p=inp.selectionStart;inp.value=inp.value.toUpperCase();try{inp.setSelectionRange(p,p)}catch(e){}
   data[t.id+"_"+i]=inp.value;save();draw(d,inp.value);
  });
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")inp.blur()});
  d.querySelector(".go").addEventListener("click",function(){inp.blur();openFull(inp.value)});
  d.querySelector(".bc").addEventListener("click",function(){if(!check(inp.value)){inp.blur();openFull(inp.value)}});
  if(t.cam){d.querySelector(".cam").addEventListener("click",function(){inp.blur();scan(function(txt){var r=convert(txt);var mg=d.querySelector(".msg");if(r.err){mg.style.color="";mg.textContent=r.err;return}inp.value=r.val;data[t.id+"_"+i]=r.val;save();draw(d,r.val);mg.style.color="var(--muted)";mg.textContent="Lu : "+r.read})})}
  m.appendChild(d);draw(d,inp.value);
 });
 if(cur===0){var n=document.createElement("p");n.className="note";n.textContent="Astuce : dans Safari, touchez Partager puis « Sur l’écran d’accueil » pour l’ouvrir comme une application. Les minuscules sont converties automatiquement en majuscules.";m.appendChild(n)}
 [].forEach.call(document.querySelectorAll("#nav button"),function(b,i){b.className=i===cur?"on":""});
}
var nav=document.getElementById("nav");
TABS.forEach(function(t,i){
 var b=document.createElement("button");b.type="button";
 b.innerHTML='<svg><use href="#ic"/></svg>'+t.label;
 b.addEventListener("click",function(){cur=i;render()});nav.appendChild(b);
});

var lock=null,rotated=false;
function layout(){
 var st=document.getElementById("stage"),W=window.innerWidth,H=window.innerHeight;
 if(rotated){st.style.cssText="width:"+H+"px;height:"+W+"px;left:"+((W-H)/2)+"px;top:"+((H-W)/2)+"px;transform:rotate(90deg)"}
 else{st.style.cssText="width:"+W+"px;height:"+H+"px;left:0;top:0"}
}
function openFull(s){
 var st=document.getElementById("stage");
 st.innerHTML=svg(s)+'<div class="t">'+esc(s)+'</div><div class="h">Toucher l’écran pour fermer</div>';
 document.getElementById("full").className="show";layout();
 try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(l){lock=l}).catch(function(){})}catch(e){}
}
function closeFull(){
 document.getElementById("full").className="";
 try{if(lock){lock.release();lock=null}}catch(e){}
}
document.getElementById("full").addEventListener("click",closeFull);
document.getElementById("rot").addEventListener("click",function(e){e.stopPropagation();rotated=!rotated;layout()});
window.addEventListener("resize",layout);
render();
</script>
</body>
</html>
